# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
# v1 runs the Pi coding agent only; coding_agent: claude_code arrives in v2.
#
# THE ROSTER BELOW IS AN ILLUSTRATION, NOT A WORKING SET. Every model line is
# `provider/id`, and the provider must be one your pi install is actually
# authenticated for — the names here show the shape (a strong reasoner plans and
# reviews, a cheaper model scouts) rather than models you are certain to have.
# Run `pi --list-models` and replace them before your first run; validation
# stops the run and names any model it cannot find, so nothing spawns against a
# provider you do not have.
defaults:
  coding_agent: pi
  model: google/gemini-3.6-flash   # provider/id — a bare pattern is ambiguous across providers
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
  harness_engineering: []          # pi extensions loaded into the harness (-e)
  # Roster-wide allowlist; any agent may override with its own list.
  # NOTE: --tools filters extension and custom tools too, not just builtins. An agent
  # whose harness_engineering extension registers a tool MUST name that tool in its own
  # tools list — otherwise the extension loads and its tool is silently filtered out.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.py.
  #
  # `writes:` per agent says what it may change IN THE WORKTREE. The only
  # canonical write grant is this run's exact session subtree (context_handoff,
  # envelopes, prompts, raw output); data_dir itself is never a broad grant.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
  # Untracked runtime only. permissions.validate_data_dir refuses to start a run
  # whose data_dir overlaps tracked/source files, so this must not be the
  # adws/adw_data/ tree the installer stamps prompts and harness files into.
  data_dir: adws/adw_runtime       # untracked runtime: {data_dir}/sessions/{adw_id}/{agent_name}/
  # Where this repo's run worktrees live. Fixed and pre-created — never a path
  # an agent picks for itself. {repo_name} substitutes the checkout's own folder
  # name at runtime (runner.py Run.__init__), so the line is portable across
  # repos unmodified. Resolved relative to the checkout, so the default puts the
  # trees in a sibling directory: ../<repo>-worktrees/.
  #
  # It is also the ONLY path outside the repo any agent may touch
  # (adw_modules/permissions.py guard_tool_paths). The grant is this run's own
  # tree, not the whole root — one run cannot write into another's.
  worktree_root: ../{repo_name}-worktrees
  worktree:
    enabled: true                  # every run works in its own checkout; set false to run in-place
    branch_prefix: sssf/           # every run branch is named sssf/<something>
    copy_files:                    # untracked files a fresh worktree still needs
      - .env
    # Only used by issue-derived runs (adw_modules/issue_ingestion.py): an issue
    # labelled "target: main" lands on main, anything else on feat/<target>.
    target_label_prefix: "target: "
    target_branch_map:
      main: main
      "*": feat/{target}
  # Fail closed before spawning the agent if a complete, restorable baseline
  # cannot be established within these bounds. They guard against an unbounded
  # walk, not against repo size — raise max_bytes if a large checkout trips it.
  permission_guard:
    max_files: 100000
    max_bytes: 1073741824          # 1 GiB
    max_worktrees: 32
    max_seconds: 120
    lock_timeout_seconds: 120

observability:
  db: adws/adw_runtime/sssf.db     # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

agents:
  - name: planner
    model: fireworks/accounts/fireworks/models/kimi-k3
    thinking: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    harness_engineering:
      - adws/adw_data/harness_engineering/subagents.ts    # registers the four subagent_* tools below
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  - name: builder
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md
    harness_engineering:
      - adws/adw_data/harness_engineering/subagents.ts    # registers the four subagent_* tools below
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.py. See SKILL.md hard rule 8.

  - name: reviewer
    model: openai/gpt-5.6-terra
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # full read surface; write only for review.md, no edit
      - read
      - grep
      - find
      - ls
      - bash
      - write

  # Required by adws/adw_coderabbit.py, which triages a CodeRabbit review before
  # the builder touches anything.
  - name: triager
    model: openai/gpt-5.6-terra
    thinking: high
    color: "#38bdf8"
    purpose: Decide which CodeRabbit findings are real before any code is touched.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/triager/system.md
      user: adws/adw_data/prompt_engineering/triager/user.md
    writes: []                     # judgement only. A triager that could edit could
                                   # "fix" a finding instead of ruling on it, and the
                                   # builder would then be handed a decision already acted on.
    tools:                         # full read surface; it rules on findings, it does not repair them
      - read
      - grep
      - find
      - ls
      - bash

  - name: documenter
    model: openai/gpt-5.6-luna
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
    writes:                        # documentation only — "document only" is a rule now,
      - app_docs/                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit

  # ── PR review families ───────────────────────────────────────────────────
  # Two independent review ADWs, and neither may edit what it reviews: every
  # seat below is writes: [] with no edit tool, so a reviewer cannot quietly
  # fix what it is supposed to be reporting.
  #
  #   adversarial (adw_pr_review_m3m3 / _mixed): per-file review, then an audit
  #     pass that treats pass 1's claims as a target. Asks 'is this correct'.
  #   two-axis (adw_pr_review_2axis_m3 / _codex): standards and spec judged
  #     separately. Asks 'is it written the way this repo writes code' and 'is
  #     it the thing the issue asked for' -- questions the other never asks.
  #
  # M3 and codex variants of each exist so a split verdict can be paid for when
  # a PR matters. The gates key on the review, never on the model.

  - name: file_reviewer_m3
    model: minimax/MiniMax-M3
    thinking: high
    color: "#a78bfa"
    purpose: Attack and verify ONE changed file of a PR; report, never repair.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/file_reviewer/system.md
      user: adws/adw_data/prompt_engineering/file_reviewer/user.md
    writes: []
    tools:                         # full read surface; write only for its findings file
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: auditor_m3
    model: minimax/MiniMax-M3
    thinking: high
    color: "#f472b6"
    purpose: Audit pass 1 on one file for misses and false positives; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/auditor/system.md
      user: adws/adw_data/prompt_engineering/auditor/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  # The mixed-variant audit seat. Same prompts, different family — a model that
  # disagrees for structural reasons rather than sampling ones.

  - name: auditor_codex
    model: openai-codex/gpt-5.6-terra
    thinking: high
    color: "#f472b6"
    purpose: Audit pass 1 on one file with a different model family's blind spots.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/auditor/system.md
      user: adws/adw_data/prompt_engineering/auditor/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: review_synthesizer
    model: minimax/MiniMax-M2.7
    color: "#94a3b8"
    purpose: Merge per-file findings into one report; aggregate only, never add.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/review_synthesizer/system.md
      user: adws/adw_data/prompt_engineering/review_synthesizer/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  # ── Two-axis PR review (adw_pr_review_2axis_m3.py / _codex.py) ─────────────
  # Two axes, never one agent: Standards asks "is this written the way we write
  # code here", Spec asks "is this what the issue asked for". Answered together,
  # the loud finding masks the quiet one. Each variant swaps both seats so the
  # two mounts can be run head to head on the same PR.

  - name: standards_axis_m3
    model: minimax/MiniMax-M3
    thinking: high
    color: "#34d399"
    purpose: Judge a diff against documented repo standards and the smell baseline, only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/standards_axis/system.md
      user: adws/adw_data/prompt_engineering/standards_axis/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: spec_axis_m3
    model: minimax/MiniMax-M3
    thinking: high
    color: "#60a5fa"
    purpose: Judge a diff against the originating issue and its cited documents, only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/spec_axis/system.md
      user: adws/adw_data/prompt_engineering/spec_axis/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: standards_axis_codex
    model: openai-codex/gpt-5.4
    thinking: high
    color: "#34d399"
    purpose: The Standards axis on a different mind, with no single-call timeout.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/standards_axis/system.md
      user: adws/adw_data/prompt_engineering/standards_axis/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: spec_axis_codex
    model: openai-codex/gpt-5.4
    thinking: high
    color: "#60a5fa"
    purpose: The Spec axis on a different mind, with no single-call timeout.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/spec_axis/system.md
      user: adws/adw_data/prompt_engineering/spec_axis/user.md
    writes: []
    tools:
      - read
      - grep
      - find
      - ls
      - bash
      - write
